events {}
http {
    # ODOO Server(s) — one nginx vhost per running container, matched by name.
    # <branch-name>.localhost -> the odoo container named <branch-name>, always
    # on its own internal 8069 (each container is its own network namespace, so
    # there's no host-port collision no matter how many run at once).
    resolver 127.0.0.11 valid=30s;  # Docker internal DNS
    server {
        listen 80;
        server_name ~^(?<container>.+)\.localhost$;

        location / {
            set $odoo "$container:8069";        # container name, dynamic resolution
            proxy_pass http://$odoo;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
